<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0b5d42"><title>Copa Internacional 2026</title><style>
:root{--g:#0b5d42;--g2:#147a59;--bg:#f3f6f5;--card:#fff;--txt:#17221e;--mut:#68766f;--line:#dbe4df;--gold:#e8b640}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt)}header{background:linear-gradient(135deg,var(--g),var(--g2));color:white;padding:calc(18px + env(safe-area-inset-top)) 18px 18px;position:sticky;top:0;z-index:4;box-shadow:0 2px 12px #0002}header h1{font-size:20px;margin:0}header small{opacity:.85}.tabs{display:flex;gap:7px;padding:10px;overflow:auto;background:#fff;position:sticky;top:78px;z-index:3;border-bottom:1px solid var(--line)}button{font:inherit}.tab{white-space:nowrap;border:0;border-radius:20px;padding:9px 13px;background:#e9efec;color:#28433a}.tab.on{background:var(--g);color:#fff}.wrap{max-width:950px;margin:auto;padding:12px 12px 90px}.card{background:var(--card);border-radius:15px;padding:14px;margin:10px 0;box-shadow:0 2px 10px #143c2c10;border:1px solid #e8eeeb}h2{font-size:20px;margin:5px 0 12px}h3{font-size:16px;margin:6px 0 10px}.muted{color:var(--mut);font-size:13px}.tie{border-top:1px solid var(--line);padding:12px 0}.tie:first-of-type{border-top:0}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-weight:650;font-size:14px}.teams span:last-child{text-align:right}.rubbers{display:grid;gap:7px;margin-top:10px}.rub{display:grid;grid-template-columns:72px 1fr 1fr;gap:6px;align-items:center}.rub label{font-size:12px;color:var(--mut)}.win{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 5px;font-size:12px}.win.sel{background:var(--g);color:#fff;border-color:var(--g)}input.score{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;margin-top:7px}.badge{display:inline-block;padding:4px 8px;border-radius:12px;background:#e7f4ee;color:var(--g);font-size:12px;font-weight:700}.stand{width:100%;border-collapse:collapse;font-size:13px}.stand th,.stand td{padding:8px 5px;border-bottom:1px solid var(--line);text-align:center}.stand th:nth-child(2),.stand td:nth-child(2){text-align:left}.stand tr:first-child td{font-weight:700}.ko{display:grid;gap:10px}.match{border:1px solid var(--line);border-radius:12px;padding:11px}.match .title{font-size:12px;color:var(--mut);font-weight:700}.pick{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.pick button{border:1px solid var(--line);border-radius:9px;background:white;padding:10px 6px}.pick button.sel{background:var(--g);color:white}.actions{display:flex;gap:8px;flex-wrap:wrap}.action{border:0;border-radius:10px;padding:10px 12px;background:var(--g);color:#fff}.action.alt{background:#e9efec;color:#28433a}.podium{font-size:15px;line-height:1.9}.empty{padding:25px 10px;text-align:center;color:var(--mut)}@media(min-width:700px){.groups{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tabs{top:78px}}
</style></head><body><header><h1>🏆 Copa Internacional 2026</h1><small>Resultados y clasificación · 16 equipos</small></header><nav class="tabs" id="tabs"></nav><main class="wrap" id="app"></main><script>
const GROUPS={"1": ["U PADEL (France–Espagne)", "PADEL VINTAGE", "PANGO SPORTS (France)", "ADOUR (France)"], "2": ["PADEL SPORT ACADEMY (Argentine)", "PADEL CENTER (Roumanie)", "SHARK (Espagne)", "BUP (France)"], "3": ["MANANTIALES (Espagne)", "DRAGON (Tahiti)", "BURDIGALA (France)", "SILIN (Russie)"], "4": ["BORDEAUX (France)", "TMAX (Espagne)", "AECP (Espagne)", "SQUADRA CORSA (France)"]}; const RUB=['MASC 1','MASC 2','FEM 1'];
const pairs=[[0,1],[2,3],[0,2],[1,3],[0,3],[1,2]];
let S=JSON.parse(localStorage.getItem('copa2026')||'{"group":{},"ko":{}}'); function save(){localStorage.setItem('copa2026',JSON.stringify(S))}
let view='grupos'; const esc=s=>(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;');
function gid(g,a,b){return `g${g}-${a}-${b}`}; function tie(g,a,b){let k=gid(g,a,b); return S.group[k]||(S.group[k]={w:[null,null,null],score:['','','']})}

// Resultados transcritos de 10 actas; solo se precargan si no hay resultados guardados.
const ACTAS=[
 [1,1,3,[0,0,0],['5/7 6/3 10/4','6/3 6/2','6/4 6/0']],
 [4,1,0,[1,0,0],['3/6 6/4 10/4 (revisar)','6/1 6/2','2/6 6/4 10/6']],
 [4,1,3,[0,0,0],['7/6 6/0','6/0 6/1','6/0 6/1']],
 [4,0,2,[0,0,0],['6/1 6/3','6/0 6/2','6/0 6/2']],
 [1,0,2,[0,0,0],['6/2 6/0','6/0 10/6 (revisar)','6/0 6/0']],
 [2,1,3,[0,0,0],['6/0 6/1','6/1 6/1','6/0 6/2']],
 [3,1,3,[0,0,0],['6/0 6/1','3/6 6/3 10/8','6/0 6/1']],
 [2,0,2,[1,0,1],['7/6 6/2','6/1 6/0','6/3 6/2']],
 [3,0,2,[0,0,0],['6/2 6/3','6/0 6/3','6/0 6/0']],
 [3,0,1,[0,0,0],['6/2 6/0','6/2 6/2','6/2 6/0']]
];
// Seis actas adicionales. Ganador por pareja: 0=equipo 1, 1=equipo 2.
const ACTAS_NUEVAS=[
 [1,0,1,[0,1,1],['7/6 6/1','6/4 7/6','6/0 6/0']],
 [4,2,3,[0,0,0],['6/3 6/0 (revisar)','7/6 6/1','6/2 6/1']],
 [1,2,3,[1,1,1],['6/3 6/4','6/3 6/4 7/6 (revisar)','6/0 6/2']],
 [2,0,1,[0,1,1],['6/3 7/5 (revisar)','6/4 6/3','6/0 6/3']],
 [3,2,3,[1,0,0],['6/1 6/2','6/2 6/4','6/1 6/0']],
 [2,2,3,[0,0,0],['6/0 6/1','6/0 6/0','6/0 6/1']]
];
function applyActa(item,overwrite=false){let [g,x,y,w,sc]=item,a=Math.min(x,y),b=Math.max(x,y),reverse=x!==a,k=`g${g}-${a}-${b}`;
 if(!overwrite&&S.group[k])return;
 S.group[k]={w:w.map(z=>reverse?(z===0?x:y):(z===0?a:b)),score:sc};
}
if(!localStorage.getItem('copa2026')){
 for(const acta of ACTAS)applyActa(acta);
 for(const acta of ACTAS_NUEVAS)applyActa(acta);
 save();
}else if(localStorage.getItem('copa2026_actas16')!=='1'){
 // Conservar resultados existentes; añadir solo encuentros aún vacíos.
 for(const acta of ACTAS_NUEVAS)applyActa(acta);
 // Corregir la asociación inicial de la primera acta si seguía con datos de ejemplo.
 const old=S.group['g1-0-1'];
 if(old&&JSON.stringify(old.score)===JSON.stringify(['5/7 6/3 10/4','6/3 6/2','6/4 6/0'])){
   if(!S.group['g1-1-3'])S.group['g1-1-3']={...old,w:[1,1,1]};
   delete S.group['g1-0-1'];
   applyActa(ACTAS_NUEVAS[0]);
 }
 save();
}
localStorage.setItem('copa2026_actas16','1');
// Marcadores escritos desde el punto de vista de la pareja ganadora.
// Un super tie-break (p. ej. 10/6) cuenta como un set, pero no como juegos.
function parseScore(score){
 const sets=[...String(score||'').matchAll(/(\d+)\s*[-/]\s*(\d+)/g)].map(m=>[+m[1],+m[2]]);
 let sf=0,sa=0,gf=0,ga=0;
 for(const [x,y] of sets){if(x>y)sf++;else if(y>x)sa++;
   if(Math.max(x,y)<10){gf+=x;ga+=y;}}
 return {sf,sa,gf,ga,valid:sets.length>0};
}
function standings(g){
 let st=GROUPS[g].map((n,i)=>({i,n,j:0,g:0,p:0,rf:0,rc:0,sg:0,sp:0,jg:0,jp:0,missing:0}));
 pairs.forEach(([a,b])=>{
   let t=tie(g,a,b),wa=0,wb=0;
   for(let r=0;r<3;r++){
     let w=t.w[r];if(w!==a&&w!==b)continue;
     if(w===a)wa++;else wb++;
     st[w].p++;
     let score=parseScore(t.score[r]);
     if(!score.valid){st[a].missing++;st[b].missing++;continue;}
     let win=st[w],lose=st[w===a?b:a];
     win.sg+=score.sf;win.sp+=score.sa;lose.sg+=score.sa;lose.sp+=score.sf;
     win.jg+=score.gf;win.jp+=score.ga;lose.jg+=score.ga;lose.jp+=score.gf;
   }
   if(wa+wb===3){st[a].j++;st[b].j++;st[a].rf+=wa;st[a].rc+=wb;st[b].rf+=wb;st[b].rc+=wa;if(wa>wb)st[a].g++;else st[b].g++;}
 });
 return st.sort((x,y)=>y.p-x.p||((y.sg-y.sp)-(x.sg-x.sp))||((y.jg-y.jp)-(x.jg-x.jp))||y.sg-x.sg||y.jg-x.jg||x.n.localeCompare(y.n));
}
function groupComplete(g){return standings(g).every(x=>x.j===3)} function allGroups(){return [1,2,3,4].every(groupComplete)}
function q(rank,g){let st=standings(g);return groupComplete(g)?st[rank-1].n:`${['1.º','2.º','3.º','4.º'][rank-1]} Grupo ${g}`}
const defs=[
['101',()=>q(1,1),()=>q(1,4)],['102',()=>q(1,2),()=>q(1,3)],['201',()=>q(2,1),()=>q(2,4)],['202',()=>q(2,2),()=>q(2,3)],['301',()=>q(3,1),()=>q(3,4)],['302',()=>q(3,2),()=>q(3,3)],['401',()=>q(4,1),()=>q(4,4)],['402',()=>q(4,2),()=>q(4,3)],
['103',()=>winner('101'),()=>winner('102')],['104',()=>loser('101'),()=>loser('102')],['203',()=>winner('201'),()=>winner('202')],['204',()=>loser('201'),()=>loser('202')],['303',()=>winner('301'),()=>winner('302')],['304',()=>loser('301'),()=>loser('302')],['403',()=>winner('401'),()=>winner('402')],['404',()=>loser('401'),()=>loser('402')]];
function def(id){return defs.find(x=>x[0]===id)} function participants(id){let d=def(id);return [d[1](),d[2]()]}; function winner(id){let [a,b]=participants(id),v=S.ko[id];return v===0?a:v===1?b:`Ganador ${id}`} function loser(id){let [a,b]=participants(id),v=S.ko[id];return v===0?b:v===1?a:`Perdedor ${id}`}
function tabs(){document.getElementById('tabs').innerHTML=[['grupos','Liguilla'],['clas','Clasificación'],['semis','Semifinales'],['finales','Finales'],['puestos','Puestos']].map(x=>`<button class="tab ${view===x[0]?'on':''}" onclick="view='${x[0]}';render()">${x[1]}</button>`).join('')}
function setRub(g,a,b,r,w){tie(g,a,b).w[r]=w;save();render()} function setScore(g,a,b,r,v){tie(g,a,b).score[r]=v;save()}
function groupCard(g){let teams=GROUPS[g];return `<section class="card"><h2>Grupo ${g}</h2>${pairs.map(([a,b])=>{let t=tie(g,a,b);return `<div class="tie"><div class="teams"><span>${esc(teams[a])}</span><b>VS</b><span>${esc(teams[b])}</span></div><div class="rubbers">${RUB.map((r,i)=>`<div><div class="rub"><label>${r}</label><button class="win ${t.w[i]===a?'sel':''}" onclick="setRub(${g},${a},${b},${i},${a})">${esc(teams[a].split(' (')[0])}</button><button class="win ${t.w[i]===b?'sel':''}" onclick="setRub(${g},${a},${b},${i},${b})">${esc(teams[b].split(' (')[0])}</button></div><input class="score" placeholder="Resultado opcional: 6-4 6-3" value="${esc(t.score[i])}" onchange="setScore(${g},${a},${b},${i},this.value)"></div>`).join('')}</div></div>`}).join('')}</section>`}
function table(g){let s=standings(g);return `<section class="card"><h2>Grupo ${g} ${groupComplete(g)?'<span class="badge">COMPLETO</span>':''}</h2><div style="overflow-x:auto"><table class="stand"><thead><tr><th>#</th><th>Equipo</th><th>J</th><th>PG</th><th>Pts</th><th>SG</th><th>SP</th><th>Dif S</th><th>JG</th><th>JP</th><th>Dif J</th></tr></thead><tbody>${s.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.n)}</td><td>${x.j}</td><td>${x.p}</td><td><b>${x.p}</b></td><td>${x.sg}</td><td>${x.sp}</td><td><b>${x.sg-x.sp}</b></td><td>${x.jg}</td><td>${x.jp}</td><td><b>${x.jg-x.jp}</b></td></tr>`).join('')}</tbody></table></div><div class="muted" style="margin-top:8px">Cada partido ganado = 1 punto; perdido = 0. Desempate: diferencia de sets, después diferencia de juegos. SG/SP: sets ganados/perdidos; JG/JP: juegos ganados/perdidos.</div>${s.some(x=>x.missing)?'<div class="muted" style="margin-top:6px">⚠ Hay marcadores sin introducir: las diferencias de sets y juegos son provisionales.</div>':''}</section>`}
function koMatch(id){let [a,b]=participants(id),v=S.ko[id], ready=!a.includes('Ganador')&&!a.includes('Perdedor')&&!b.includes('Ganador')&&!b.includes('Perdedor')&&!a.match(/Grupo/)&&!b.match(/Grupo/);return `<div class="match"><div class="title">PARTIDO ${id}</div><div class="pick"><button ${ready?'':'disabled'} class="${v===0?'sel':''}" onclick="ko('${id}',0)">${esc(a)}</button><button ${ready?'':'disabled'} class="${v===1?'sel':''}" onclick="ko('${id}',1)">${esc(b)}</button></div></div>`}
function ko(id,v){S.ko[id]=v;save();render()} function render(){tabs();let a=document.getElementById('app'); if(view==='grupos')a.innerHTML='<div class="groups">'+[1,2,3,4].map(groupCard).join('')+'</div>'; if(view==='clas')a.innerHTML='<div class="groups">'+[1,2,3,4].map(table).join('')+'</div>'; if(view==='semis')a.innerHTML=`<section class="card"><h2>Semifinales por puestos</h2><div class="muted">Se rellenan automáticamente al completar los cuatro grupos.</div><div class="ko" style="margin-top:12px">${['101','102','201','202','301','302','401','402'].map(koMatch).join('')}</div></section>`; if(view==='finales')a.innerHTML=`<section class="card"><h2>Finales por puestos</h2><div class="ko">${['103','104','203','204','303','304','403','404'].map(koMatch).join('')}</div></section>`; if(view==='puestos'){let done=['103','104','203','204','303','304','403','404'].every(id=>S.ko[id]!==undefined);let pos=done?[[1,winner('103')],[2,loser('103')],[3,winner('104')],[4,loser('104')],[5,winner('203')],[6,loser('203')],[7,winner('204')],[8,loser('204')],[9,winner('303')],[10,loser('303')],[11,winner('304')],[12,loser('304')],[13,winner('403')],[14,loser('403')],[15,winner('404')],[16,loser('404')]]:[];a.innerHTML=`<section class="card"><h2>Clasificación final</h2>${done?`<div class="podium">${pos.map(x=>`<div><b>${x[0]}.º</b> · ${esc(x[1])}</div>`).join('')}</div>`:'<div class="empty">Completa semifinales y finales para obtener los puestos 1–16.</div>'}<hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="actions"><button class="action" onclick="exportData()">Exportar copia</button><button class="action alt" onclick="resetAll()">Reiniciar torneo</button></div></section>`}}
function exportData(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='copa-internacional-2026-resultados.json';a.click();URL.revokeObjectURL(u)} function resetAll(){if(confirm('¿Borrar todos los resultados?')){S={group:{},ko:{}};save();render()}} render();
</script></body></html>
